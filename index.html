<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Cabrera & Consultores — Sistema de Gestión Estratégica</title>
    <meta name="robots" content="noindex, nofollow"/>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg"/>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
    <link href="https://fonts.googleapis.com/css2?family=Marcellus&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"/>
    <style>
      *{margin:0;padding:0;box-sizing:border-box;}
      :root{
        --bg:#EEF1F3;--bg2:#FFFFFF;--bg3:#E4E9ED;--border:#D3DBE1;
        --text:#0A2029;--text2:#284450;--text3:#56707E;
        --primary:#12404F;--primary-light:#E1EAEE;--accent:#8E6321;
        --shadow:0 1px 2px rgba(10,32,41,.05),0 1px 3px rgba(10,32,41,.04);
        --shadow-md:0 4px 12px rgba(10,32,41,.08),0 2px 4px rgba(10,32,41,.04);
        --shadow-lg:0 12px 32px -18px rgba(10,32,41,.30);
        --radius:10px;--radius-sm:6px;--radius-lg:14px;
        --font-display:'Marcellus','Hoefler Text',Georgia,serif;
        --font-body:'IBM Plex Sans','Helvetica Neue',Arial,sans-serif;
      }
      body{font-family:var(--font-body);background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;}
      *{transition:background-color .2s,border-color .2s,color .15s;}
      ::-webkit-scrollbar{width:5px;height:5px;}
      ::-webkit-scrollbar-track{background:transparent;}
      ::-webkit-scrollbar-thumb{background:var(--border);border-radius:99px;}
      button,input,select,textarea{font-family:var(--font-body);}
      @keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
      @keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
      @keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
      @keyframes scaleIn{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:scale(1)}}
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/main.jsx"></script>
  </body>
</html>
