name: Aplicar version CyC
on:
  push:
    branches: [main]
    paths: ['cyc-interno.bundle']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Integrar version Cabrera & Consultores
        run: |
          git config user.name "Erick Islas Monroy"
          git config user.email "erickislasmonrroy23@gmail.com"
          git bundle verify cyc-interno.bundle
          git fetch ./cyc-interno.bundle cyc-interno:cyc-interno
          git push origin cyc-interno
          git merge --no-edit -X theirs cyc-interno
          git rm -q --ignore-unmatch cyc-interno.bundle .github/workflows/aplicar-cyc.yml
          git commit -m "Publica version C&C interno y retira archivos temporales"
          git push origin HEAD:main
