name: Aplicar paquete CyC
on:
  push:
    branches: [main]
    paths: ['cyc-paquete.bundle']
permissions:
  contents: write
jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Integrar paquete
        run: |
          git config user.name "Erick Islas Monroy"
          git config user.email "erickislasmonrroy23@gmail.com"
          git bundle verify cyc-paquete.bundle
          git fetch ./cyc-paquete.bundle cyc-paquete:cyc-paquete
          git merge --no-edit -X theirs cyc-paquete
          git rm -q --ignore-unmatch cyc-paquete.bundle .github/workflows/aplicar-paquete.yml
          git commit -m "Integra paquete C&C y retira archivos temporales"
          git push origin HEAD:main
